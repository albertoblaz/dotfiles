# 1Password SSH agent — which vaults' SSH keys get exposed to ssh.
#
# Installed to ~/.config/1Password/ssh/agent.toml by bootstrap.sh. THIS copy is
# the source of truth — edit it here and re-run ./bootstrap.sh, rather than
# editing the installed file, so there is only ever one authored version.
#
# THE TRAP: this file OVERRIDES the agent's default vault list rather than
# extending it — the agent serves ONLY what is listed below. That is why the
# everyday Personal vault is listed explicitly; drop it and the GitHub key stops
# being served, which breaks git over SSH.
#
# Why this file exists at all, and what may go in it given the repo is public:
# see bootstrap.README.md § "1Password SSH agent — which vaults it serves".

[[ssh-keys]]
vault = "Personal"

[[ssh-keys]]
vault = "Golden Gamers Go"
